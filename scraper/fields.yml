# Field classification table (research §3.3, plan Phase 1).
#
# 1. categories: substrings of the HWIS 訓練コース分類 string (after NFKC),
#    e.g. 「実践コース(IT分野)」 or 「離転職者訓練(施設内)(建設関連分野)」.
#    Longer matches win and consume their text (「医療事務分野」 is not also
#    「事務分野」). A `broad` category (it spans several app fields) is used
#    only when the course name matches no keyword.
# 2. keywords: substrings of the course name (after NFKC). Longer keywords
#    win: a match consumes its characters, so 「医療事務」 is medical and
#    does not also count as 「事務」 (office). The same keyword may sit under
#    two fields (建築CAD → design + building).
#    Pure-ASCII keywords match case-insensitively; two-letter ones (IT, AI)
#    only as whole words, so 「SUIT」 is not IT.
# 3. Neither matches → other.
#
# Tune after each full collection: the target is other ≤ 20% (stats.json).

categories:
  - {match: "IT分野", fields: [it]}
  - {match: "情報通信分野", fields: [it]}
  - {match: "情報処理分野", fields: [it]}
  - {match: "営業・販売・事務分野", fields: [office]}
  - {match: "事務分野", fields: [office]}
  - {match: "医療事務分野", fields: [medical]}
  - {match: "介護福祉分野", fields: [care]}
  - {match: "介護・医療・福祉分野", fields: [care], broad: true}
  - {match: "デザイン分野", fields: [design]}
  - {match: "建設関連分野", fields: [building]}
  - {match: "製造関連分野", fields: [manufacturing]}

